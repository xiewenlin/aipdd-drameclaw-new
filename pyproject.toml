[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supertale-ce"
version = "1.1.4"
description = "SuperTale Community Edition API and video pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Elastic-2.0"
