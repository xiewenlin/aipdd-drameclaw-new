# 閬垮厤 hatchling 榛樿 glob(LICENSE*)鍦ㄦ牴鐩綍鎵句笉鍒版枃浠讹拷?
license-files = ["LICENSES/Elastic-2.0.txt"]
authors = [
    { name = "Eric" }
]
dependencies = [
    # Pin ==1.107.0 (= the version 3060 runs). pydantic-ai 2.x removed
    # Agent(output_retries=...) which the agents here still pass (scene/prop/asset
    # planners, verifiers). Unpinned >= drifted EE/CE image builds onto 2.1.0 锟?
    # "Agent.__init__() got an unexpected keyword argument 'output_retries'". Stay
    # on 1.x until a deliberate output_retries -> retries={'output':N} migration.
    "pydantic-ai-slim[anthropic,google,openai,openrouter]==1.107.0",
    "openai>=2.29.0",
    "pydantic>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "pymysql>=1.1.0",
    "typer>=0.9.0",
    "click<8.2.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.19.0",
    "numpy>=1.24.0,<2.0.0",
    "edge-tts>=6.0.0",
    "dashscope>=1.0.0",
    "Pillow>=10.0.0",
    "fastapi>=0.128.0",
    "httpx>=0.28.0",
    "python-docx>=1.1.0",
    "cognee==1.0.5",
    "litellm>=1.85.0.dev1",
    "nest-asyncio>=1.5.0",
    "claude-agent-sdk>=0.1.72",
    "mcp>=1.19.0",
    "celery>=5.4.0",
    "pypinyin>=0.55.0",
    "oss2>=2.19.1",
    "gunicorn>=21.2.0",
    "uvicorn[standard]>=0.27.0",
    "sse-starlette>=2.0.0",
    "python-ulid>=2.2.0",
    "asyncpg>=0.30.0",
    "packaging>=24.0",
    "portalocker>=3.2.0",
    "pymongo>=4.13.0,<5.0.0",
]

[project.scripts]
novelvideo = "novelvideo.cli:app"

[project.optional-dependencies]
world = [
    "sharp @ git+https://github.com/apple/ml-sharp.git",
    "da2 @ git+https://github.com/EnVision-Research/DA-2.git#subdirectory=src",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "timm>=1.0.20",
    "transformers>=4.57.0,<5.0.0",
    "einops==0.8.0",
    "huggingface-hub>=0.35.0,<1.0.0",
    "safetensors>=0.6.0",
    "plyfile>=1.1.2",
    "scipy>=1.16.0",
    "matplotlib>=3.10.0",
    "imageio>=2.37.0",
    "pillow-heif>=1.1.0",
    "jaxtyping>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.5.0",
    "fakeredis>=2.20.0",
    "respx>=0.22.0",
    "ruff==0.15.20",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
